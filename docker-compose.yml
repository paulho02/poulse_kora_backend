services:
  postgres:
    image: postgres:12
    restart: always
    env_file:
      - .env
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      timeout: 2s
      retries: 3

  redis:
    image: redis:8-alpine
    restart: always
    # AOF persistence, mirroring postgres's durability-by-default.
    # REDIS_PASSWORD comes from .env, which compose auto-loads for ${...} substitution.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping
      interval: 3s
      timeout: 2s
      retries: 3

  # Local stand-in for the production bucket (a Railway Bucket, Tigris underneath).
  # The point is protocol fidelity, not feature parity: the backend speaks plain
  # S3 + SigV4 to both, so moving to Railway is a change of AWS_* / S3_* variables and
  # nothing else (see app/core/storage.py, RAILWAY.md).
  #
  # Pinned to the last community release MinIO published (the project stopped
  # shipping community binaries/images in late 2025). That is fine for something
  # that only ever listens on a dev machine's loopback and in CI, and it is not
  # what production runs - but it is the reason to pin rather than track a tag.
  # MINIO_API_CORS_ALLOW_ORIGIN matters for the Flutter *web* client: a presigned
  # URL is fetched cross-origin by the browser, so without CORS the fetch fails
  # even though the signature is perfectly valid.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 10

  backend:
    build:
      context: backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # The peerkola.com site (landing/). This is the production image - Caddy
  # serving the prerendered HTML, exactly what Railway runs; the override swaps
  # in the Astro dev server with hot reload. Independent of the backend.
  landing:
    build:
      context: landing
    ports:
      - "4321:4321"
    environment:
      PORT: 4321

  # frontend service disabled: the React Admin frontend is unused for now.
  # The poulse_kora_app repo will be the client. Kept here (not deleted) in
  # case it's needed again later.
  # frontend:
  #   build:
  #     context: frontend
  #   ports:
  #     - "3000:80"
  #   volumes:
  #     - ./frontend:/app:delegated
  #   environment:
  #     - NODE_ENV=production

volumes:
  app-db-data:
  redis-data:
  minio-data:
  root-home:
