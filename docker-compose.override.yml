# We specify volumes in override.yml, because volumes don't work well in a
# docker-in-docker setup (the paths of parent host rarely match the nested containers)

services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data:cached

  redis:
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data:cached

  minio:
    ports:
      # 9000 is the S3 API and has to be published, not just reachable on the
      # compose network: presigned URLs are fetched by the *client* (browser,
      # emulator, phone), which cannot resolve `minio`. That is also why
      # S3_PUBLIC_ENDPOINT_URL exists - the host is inside the signature, so
      # the URL has to be signed for whatever name the client will dial.
      # 9001 is MinIO's console, handy for eyeballing what actually landed.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data:cached

  backend:
    command: uvicorn --port 8000 --host 0.0.0.0 --reload main:app
    volumes:
      - ./backend:/app:delegated
      - root-home:/root:delegated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  landing:
    # The deps stage (node + node_modules) instead of the Caddy image, running
    # the dev server over the bind-mounted source.
    build:
      context: landing
      target: deps
    command: npx astro dev --host 0.0.0.0 --port 4321
    environment:
      # File events don't cross a Docker Desktop bind mount from Windows/macOS
      # reliably, so Vite polls instead.
      ASTRO_WATCH_POLLING: "true"
    volumes:
      - ./landing:/app:delegated
      # The image's Linux node_modules, not the host's (sharp and esbuild ship
      # per-platform binaries, so a Windows node_modules won't run here).
      - /app/node_modules
