[tool.poetry]
name = "peerkola-backend"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.13"
fastapi = ">=0.116.1,<0.142.0"
# >=0.34.3 pulls h11 >=0.16 (CVE-2025-43859, lenient chunked parsing -> request
# smuggling); uvicorn without [standard] parses HTTP with h11, so this is ours.
uvicorn = ">=0.34.3,<0.55.0"
pydantic = "^2.10.6"
requests = "^2.32.4"
alembic = "^1.15.1"
psycopg2-binary = "^2.9.10"
asyncpg = ">=0.30,<0.32"
SQLAlchemy = "^2.0.39"
fastapi-users = { extras = ["sqlalchemy"], version = ">=14.0.1,<16.0.0" }
email-validator = "^2.2.0"
pydantic-settings = "^2.8.1"
redis = { extras = ["hiredis"], version = ">=5.2.1,<9.0.0" }
aiosmtplib = "^5.1.2"
# Ceiling is load-bearing, not caution: httpx 0.28 removed the `AsyncClient(app=...)`
# shortcut that tests/conftest.py builds the test client with. The floor is
# lettermint's (>=0.27). Raising this means switching that fixture to ASGITransport.
httpx = ">=0.27,<0.29"
# Official SDK for Lettermint (https://lettermint.co), the EU transactional email
# provider behind EMAIL_PROVIDER="lettermint". See app/core/email.py - the SMTP
# connector is still the default, so this is dormant until that setting says so.
lettermint = "^2.5.0"
# Official Google library, used only to verify Google ID tokens (signature,
# issuer, expiry) in app/core/google_oauth.py. The `requests` extra selects its
# HTTP transport; `requests` is already a direct dependency above.
google-auth = { extras = ["requests"], version = "^2.38.0" }
# Post-media image validation/re-encoding: verifies uploaded bytes are actually a
# decodable image, strips EXIF (see app/core/media_validation.py for why - GPS in a
# photo's EXIF would deanonymize an anonymous poster), downscales oversized images.
Pillow = ">=11.1,<13.0"

[tool.poetry.group.dev.dependencies]
black = ">=23.10.1,<27.0.0"
pytest = ">=7.4.3,<10.0.0"
ipython = ">=8.16.1,<10.0.0"
pytest-cov = ">=6,<8"
pytest-asyncio = ">=0.21.1,<1.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.cruft]
skip = [".env"]

[tool.pytest.ini_options]
asyncio_mode = 'auto'

[tool.coverage.run]
# The default C tracer loses track of frames across this codebase's async/await +
# SQLAlchemy-async pattern (verified: lines that demonstrably execute were reported
# "missing"). sysmon (Python 3.12+ sys.monitoring, coverage 7.4+) traces correctly.
core = "sysmon"

[tool.ruff]
target-version = "py313"
line-length = 88

select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "C",  # flake8-comprehensions
  "B",  # flake8-bugbear
  "UP", # pyupgrade
  #    "I",  # isort - disabled for now
]
ignore = [
  "B008", # do not perform function calls in argument defaults
  "F401", # imported but unused, too annoyiong for my liking
]
