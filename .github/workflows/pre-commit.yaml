name: pre-commit

on:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache-dependency-path: "frontend/yarn.lock"
        cache: 'yarn'
    - run: cd frontend && yarn install
    - uses: pre-commit/action@v3.0.1
